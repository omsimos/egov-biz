name: dx-db

# Mirrors .github/workflows/egov-agentic-biz.yml: pull requests cover every
# branch, main only runs on push, so no commit is verified twice.
on:
  pull_request:
    paths:
      - "packages/db/**"
      - "packages/dx/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/dx-db.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "packages/dx/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/dx-db.yml"
  # Lets a failed migration be retried without an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with "packageManager" in the root package.json.
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # @repo/dx consumes @repo/db through its published types in dist/, and
      # turbo.json has check-types depending on the no-op "transit" task rather
      # than ^build. Without compiling first, tsc cannot resolve
      # @repo/db/schema. This is the same ordering constraint the
      # egov-agentic-biz workflow has.
      - name: Build
        run: bunx turbo run build --filter=@repo/db --filter=@repo/dx

      - name: Types
        run: bunx turbo run check-types --filter=@repo/db --filter=@repo/dx

      - name: Lint
        run: bunx turbo run lint --filter=@repo/db --filter=@repo/dx

      - name: Test
        run: bunx turbo run test --filter=@repo/db --filter=@repo/dx

  migrate:
    name: Migrate DX Turso
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: .

      # getTursoConfig() in packages/db falls back to a local file when
      # DX_TURSO_DATABASE_URL is unset, so a missing or misnamed secret would
      # migrate a throwaway database on the runner and report success. Fail
      # loudly instead of passing green against nothing.
      - name: Require remote credentials
        env:
          DX_TURSO_DATABASE_URL: ${{ secrets.DX_TURSO_DATABASE_URL }}
          DX_TURSO_AUTH_TOKEN: ${{ secrets.DX_TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$DX_TURSO_DATABASE_URL" ]; then
            echo "::error::DX_TURSO_DATABASE_URL is not set; packages/db would fall back to a local file."
            exit 1
          fi
          case "$DX_TURSO_DATABASE_URL" in
            file:*)
              echo "::error::DX_TURSO_DATABASE_URL points at a local file, not a remote Turso database."
              exit 1
              ;;
          esac
          if [ -z "$DX_TURSO_AUTH_TOKEN" ]; then
            echo "::error::DX_TURSO_AUTH_TOKEN is not set."
            exit 1
          fi

      # Applied migrations are tracked in __dx_drizzle_migrations, which is
      # separate from the app's table, so the two databases never contend.
      - name: Apply pending migrations
        run: bunx drizzle-kit migrate
        env:
          DX_TURSO_DATABASE_URL: ${{ secrets.DX_TURSO_DATABASE_URL }}
          DX_TURSO_AUTH_TOKEN: ${{ secrets.DX_TURSO_AUTH_TOKEN }}
